<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taurus Farm Kickoff Form</title>
<link rel="icon" href="logo.png">
<meta name="theme-color" content="#0A1A33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Taurus Farm brand: deep navy, electric blue, pickleball yellow */
  --navy: #0A1A33;
  --blue: #1676E0;
  --blue-soft: #E6F0FD;
  --yellow: #FFE000;
  --bg: #EEF3F9;
  --surface: #FFFFFF;
  --ink: #0A1A33;
  --muted: #4A5A72;
  --line: #C5D0DF;
  --err: #B3261E;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
.topbar { background: var(--navy); border-bottom: 4px solid var(--yellow); color: #fff; text-align: center; padding: 10px 16px; font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 72px; }
.hero { text-align: center; padding: 8px 0 20px; }
.hero img { width: 150px; height: auto; display: block; margin: 0 auto 6px; }
h1 { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; font-size: clamp(34px, 9vw, 48px); line-height: 1.05; margin: 8px 0 10px; color: var(--navy); text-wrap: balance; }
.lead { color: var(--muted); margin: 0 auto; max-width: 52ch; }
.steps { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 16px 0 0; padding: 0; list-style: none; font-size: 14px; font-weight: 600; color: var(--navy); }
.steps li { background: var(--blue-soft); border-radius: 999px; padding: 4px 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--blue); border-radius: 14px; padding: 24px 20px; box-shadow: 0 6px 24px rgba(10,26,51,.07); }
.card h2 { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 30px; line-height: 1.1; margin: 0 0 6px; outline: none; color: var(--navy); }
.card .intro { color: var(--muted); margin: 0 0 22px; }
.section { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; }
.section .num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: var(--yellow); font-weight: 700; display: grid; place-items: center; font-size: 15px; }
.section h3 { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; font-size: 22px; margin: 0; color: var(--navy); }
.field { margin: 0 0 20px; }
.field .lbl { display: block; font-weight: 700; font-size: 17px; margin: 0 0 4px; }
.req { color: var(--err); margin-left: 3px; }
.hint { color: var(--muted); font-size: 15px; margin: 0 0 8px; }
input[type="text"], input[type="email"], input[type="tel"], textarea { width: 100%; padding: 13px 14px; border: 2px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); font: inherit; font-size: 17px; transition: border-color .2s, box-shadow .2s; }
input:hover, textarea:hover { border-color: #8FA3BF; }
input:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(22,118,224,.25); }
textarea { min-height: 110px; resize: vertical; }
.field.invalid input, .field.invalid textarea { border-color: var(--err); }
.err { color: var(--err); font-size: 15px; font-weight: 600; margin: 6px 0 0; }
.divider { border: 0; border-top: 2px dashed var(--line); margin: 8px 0 22px; }
.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
.btn { font: inherit; font-weight: 700; font-size: 18px; padding: 14px 26px; border-radius: 12px; border: 2px solid var(--navy); background: var(--yellow); color: var(--navy); cursor: pointer; min-height: 52px; transition: background .2s, transform .1s, box-shadow .2s; box-shadow: 0 3px 0 var(--navy); }
.btn:hover { background: #FFEA4D; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--navy); }
.btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--blue-soft); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .6; cursor: default; }
.status { margin: 14px 0 0; font-size: 15px; color: var(--muted); }
.status.bad { color: var(--err); font-weight: 600; }
.copybox { width: 100%; min-height: 260px; font-size: 15px; }
.check { width: 64px; height: 64px; border-radius: 50%; background: var(--yellow); border: 3px solid var(--navy); display: grid; place-items: center; margin: 0 0 14px; }
.check svg { width: 34px; height: 34px; stroke: var(--navy); }
.foot { text-align: center; color: var(--muted); font-size: 14px; margin-top: 26px; }
.foot b { color: var(--navy); }
@media (max-width: 520px) { .card { padding: 20px 14px; } .btn { width: 100%; } .nav { flex-direction: column; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="topbar">Taurus Farm Pickleball Court</div>
<div class="wrap">
  <header class="hero">
    <img src="logo.png" alt="Taurus Farm Pickleball Court logo" width="150" height="142">
    <h1>Kickoff form</h1>
    <p class="lead">Tell us about Taurus Farm so we can set up your social pages and booking system. It takes about 5 minutes, and your draft is saved on this device if you need to leave.</p>
    <ol class="steps" aria-label="Form sections"><li>1 Business info</li><li>2 Offers and plans</li><li>3 Send</li></ol>
  </header>
  <main id="app"></main>
  <p class="foot">Prepared by <b>Katha Digital</b></p>
</div>

<script>
(function () {
  "use strict";

  /* Paste your Google Apps Script Web app URL (ends in /exec) here. See README. */
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbw9r-OcKXoN-0wmfW9pkLHHUvdQk8BfuKxXZMUD3COoi8jxA41NTXfMggPhmS-T08T8/exec";

  var DRAFT_KEY = "taurus-kickoff-draft-v2";

  var TITLE = "About Taurus Farm";
  var INTRO = "Fields marked * are required. Answer the rest as best you can. You can edit and send again later.";

  var FIELDS = [
    { id: "business", label: "Business Name", type: "text", required: true },
    { id: "address", label: "Business Address", hint: "Street, barangay, city, and a nearby landmark.", type: "textarea", rows: 3, required: true },
    { id: "phone", label: "Business Contact Number", type: "tel", required: true },
    { id: "email", label: "Email Address", type: "email", required: true },
    { id: "offers", label: "Business Offers", hint: "List what you offer and the price of each, such as court rental, Open Play, coaching, memberships and promos.", type: "textarea", rows: 6 },
    { id: "projects", label: "Business Future Projects", hint: "Anything you plan to build or start, such as new courts or new services. Add roughly when.", type: "textarea", rows: 5 },
    { id: "events", label: "Business Future Events", hint: "Tournaments, Open Play nights, launches or promos coming up, with dates if you have them.", type: "textarea", rows: 5 }
  ];

  var app = document.getElementById("app");
  var state = { answers: {}, done: false, mode: "sent", busy: false, message: "" };
  

  /* ---------- helpers ---------- */
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === false || v === null || v === undefined) return;
        if (k === "class") n.className = v;
        else if (k === "text") n.textContent = v;
        else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v);
      });
    }
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }

  function getVal(id) {
    var v = state.answers[id];
    return v === undefined ? "" : String(v);
  }

  function saveDraft() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ answers: state.answers })); } catch (e) { /* storage may be unavailable */ }
  }

  function loadDraft() {
    try {
      var raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && d.answers && typeof d.answers === "object") state.answers = d.answers;
    } catch (e) { /* ignore a broken draft */ }
  }

  function toText() {
    var lines = ["Taurus Farm kickoff form", "Submitted: " + new Date().toISOString().slice(0, 10), ""];
    FIELDS.forEach(function (f) {
      var v = getVal(f.id).trim();
      if (!v) { lines.push(f.label + ": Not answered"); return; }
      lines.push(v.indexOf("\n") > -1 ? f.label + ":\n" + v : f.label + ": " + v);
    });
    return lines.join("\n");
  }

  /* ---------- validation ---------- */
  function validate() {
    var errs = [];
    FIELDS.forEach(function (f) {
      var v = getVal(f.id).trim();
      if (f.required && !v) errs.push({ id: f.id, msg: "This answer is needed." });
      else if (f.type === "email" && v && !/^\S+@\S+\.\S+$/.test(v)) errs.push({ id: f.id, msg: "Check the email address. It should look like name@example.com." });
    });
    return errs;
  }

  function showErrors(errs) {
    var first = null;
    errs.forEach(function (e) {
      var wrap = app.querySelector('[data-id="' + e.id + '"]');
      if (!wrap) return;
      wrap.classList.add("invalid");
      var p = wrap.querySelector(".err");
      if (p) { p.textContent = e.msg; p.hidden = false; }
      if (!first) first = wrap;
    });
    if (first) {
      var c = first.querySelector("input, textarea");
      if (c) c.focus();
    }
  }

  /* ---------- rendering ---------- */
  function renderField(f) {
    var id = "f-" + f.id;
    var wrap = el("div", { class: "field", "data-id": f.id });
    var lab = el("label", { class: "lbl", for: id, text: f.label });
    if (f.required) lab.appendChild(el("span", { class: "req", "aria-hidden": "true", text: "*" }));
    wrap.appendChild(lab);
    if (f.hint) wrap.appendChild(el("p", { class: "hint", id: id + "-hint", text: f.hint }));
    var control = f.type === "textarea"
      ? el("textarea", { id: id, rows: String(f.rows || 3) })
      : el("input", { type: f.type, id: id, autocomplete: f.type === "email" ? "email" : (f.type === "tel" ? "tel" : "off") });
    if (f.hint) control.setAttribute("aria-describedby", id + "-hint");
    if (f.required) control.setAttribute("aria-required", "true");
    control.value = getVal(f.id);
    control.addEventListener("input", function () {
      state.answers[f.id] = control.value;
      wrap.classList.remove("invalid");
      var p = wrap.querySelector(".err");
      if (p) p.hidden = true;
      saveDraft();
    });
    wrap.appendChild(control);
    wrap.appendChild(el("p", { class: "err", role: "alert", hidden: "hidden" }));
    return wrap;
  }

  function renderForm() {
    var card = el("section", { class: "card" });
    card.appendChild(el("h2", { id: "title", tabindex: "-1", text: TITLE }));
    card.appendChild(el("p", { class: "intro", text: INTRO }));
    FIELDS.forEach(function (f, i) {
      if (i === 0) card.appendChild(el("div", { class: "section" }, [el("span", { class: "num", "aria-hidden": "true", text: "1" }), el("h3", { text: "Business information" })]));
      if (i === 4) {
        card.appendChild(el("hr", { class: "divider" }));
        card.appendChild(el("div", { class: "section" }, [el("span", { class: "num", "aria-hidden": "true", text: "2" }), el("h3", { text: "Offers and plans" })]));
      }
      card.appendChild(renderField(f));
    });
    var canSend = !!ENDPOINT;
    card.appendChild(el("div", { class: "nav" }, [
      el("button", { type: "button", class: "btn wide", text: state.busy ? "Sending..." : (canSend ? "Send to katha" : "Get my answers to send"), disabled: state.busy ? "disabled" : false, onclick: submit })
    ]));
    if (!canSend) card.appendChild(el("p", { class: "status", text: "Sending from this page is not available in this view. You will get your answers as text to copy and send to us." }));
    card.appendChild(el("p", { class: "status", text: "Please do not type bank or GCash account numbers here." }));
    if (state.message) card.appendChild(el("p", { class: "status bad", role: "alert", text: state.message }));
    return card;
  }

  function copyAnswers(ta, status) {
    var ok = false;
    try {
      ta.focus();
      ta.select();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(
          function () { status.textContent = "Copied."; },
          function () { status.textContent = "Select the text above and copy it."; }
        );
        ok = true;
      }
    } catch (e) { ok = false; }
    if (!ok) status.textContent = "Select the text above and copy it.";
  }

  function renderDone() {
    var card = el("section", { class: "card" });
    if (state.mode === "sent") {
      var chk = el("div", { class: "check", "aria-hidden": "true" });
      chk.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
      card.appendChild(chk);
      card.appendChild(el("h2", { id: "title", tabindex: "-1", text: "Thank you" }));
      card.appendChild(el("p", { class: "intro", text: "Your answers were sent to katha. If something changes, edit your answers and send them again." }));
    } else {
      card.appendChild(el("h2", { id: "title", tabindex: "-1", text: "Your answers" }));
      card.appendChild(el("p", { class: "intro", text: "Copy this text and send it to katha. We will add it to your kickoff document." }));
      var ta = el("textarea", { class: "copybox", readonly: "readonly", "aria-label": "Your answers as text" });
      ta.value = toText();
      var status = el("p", { class: "status", role: "status" });
      card.appendChild(ta);
      card.appendChild(el("div", { class: "nav" }, [
        el("button", { type: "button", class: "btn", text: "Copy answers", onclick: function () { copyAnswers(ta, status); } }),
        el("span")
      ]));
      card.appendChild(status);
    }
    card.appendChild(el("div", { class: "nav" }, [
      el("button", { type: "button", class: "btn ghost", text: "Edit my answers", onclick: function () { state.done = false; render(); } }),
      el("button", { type: "button", class: "btn", text: "Back to home", onclick: function () {
        state.answers = {}; state.message = ""; state.done = false;
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
        render(); window.scrollTo(0, 0);
      } })
    ]));
    return card;
  }

  function render(errs) {
    app.textContent = "";
    app.appendChild(state.done ? renderDone() : renderForm());
    var t = document.getElementById("title");
    if (t && !errs) t.focus({ preventScroll: true });
    if (errs) showErrors(errs);
  }

  /* ---------- submit ---------- */
  function submit() {
    var errs = validate();
    if (errs.length) { state.message = ""; render(errs); return; }
    if (!ENDPOINT) {
      state.mode = "copy";
      state.done = true;
      render();
      window.scrollTo(0, 0);
      return;
    }
    state.busy = true;
    state.message = "";
    render();
    var payload = {
      submittedAt: new Date().toISOString(),
      website: "",
      answers: JSON.parse(JSON.stringify(state.answers))
    };
    fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
      .then(function () {
        state.busy = false;
        state.mode = "sent";
        state.done = true;
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
        render();
        window.scrollTo(0, 0);
      })
      .catch(function () {
        state.busy = false;
        state.message = "We could not send your answers. Check your connection and try again, or copy them as text.";
        render();
      });
  }

  /* ---------- start ---------- */
  loadDraft();
  render();

})();
</script>
</body>
</html>
