<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taurus Farm Kickoff Form</title>
<link rel="icon" href="logo.png">
<meta name="theme-color" content="#0A1A33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Taurus Farm brand: deep navy, electric blue, pickleball yellow */
  --navy: #07142B;
  --navy-2: #0D2347;
  --blue: #1676E0;
  --blue-soft: #E8F1FD;
  --yellow: #FFE000;
  --bg: #EDF2F9;
  --surface: #FFFFFF;
  --field: #F5F8FD;
  --ink: #0A1A33;
  --muted: #4A5A72;
  --line: #CCD7E6;
  --err: #B3261E;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-text-size-adjust: 100%; }

/* Hero: navy court with faint court lines and a blue glow behind the crest */
.hero { position: relative; overflow: hidden; color: #fff; text-align: center; padding: 44px 16px 120px;
  background:
    radial-gradient(ellipse 60% 70% at 50% 28%, rgba(22,118,224,.55), transparent 70%),
    linear-gradient(180deg, var(--navy-2), var(--navy));
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 36px), 0 100%); }
.hero::before { content: ""; position: absolute; inset: 0; opacity: .5; pointer-events: none;
  background:
    linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,.10) calc(50% - 1px), rgba(255,255,255,.10) calc(50% + 1px), transparent calc(50% + 1px)),
    linear-gradient(0deg, transparent 22%, rgba(255,255,255,.10) 22%, rgba(255,255,255,.10) calc(22% + 2px), transparent calc(22% + 2px)),
    linear-gradient(90deg, transparent 12%, rgba(255,255,255,.07) 12%, rgba(255,255,255,.07) calc(12% + 2px), transparent calc(12% + 2px), transparent calc(88% - 2px), rgba(255,255,255,.07) calc(88% - 2px), rgba(255,255,255,.07) 88%, transparent 88%); }
.hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--yellow); transform: skewY(-1.4deg); transform-origin: left bottom; }
.hero-in { position: relative; max-width: 680px; margin: 0 auto; }
.eyebrow { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--yellow); border: 1px solid rgba(255,224,0,.45); border-radius: 999px; padding: 5px 14px; margin: 0 0 18px; }
.hero img { width: 168px; height: auto; display: block; margin: 0 auto 8px; filter: drop-shadow(0 14px 28px rgba(0,0,0,.45)); }
h1 { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .02em; font-size: clamp(44px, 12vw, 68px); line-height: 1; margin: 6px 0 12px; color: #fff; text-wrap: balance; }
h1 em { font-style: normal; color: var(--yellow); }
.lead { color: #C3D2EA; margin: 0 auto; max-width: 50ch; font-size: 18px; }

.wrap { max-width: 680px; margin: -84px auto 0; padding: 0 16px 56px; position: relative; }
.card { background: var(--surface); border-radius: 18px; padding: 30px 26px 28px; position: relative;
  box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 2px 4px rgba(7,20,43,.06), 0 24px 60px -12px rgba(7,20,43,.28); }
.card::before { content: ""; position: absolute; left: 26px; right: 26px; top: 0; height: 4px; border-radius: 0 0 4px 4px; background: linear-gradient(90deg, var(--blue), var(--yellow)); }
.card h2 { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .02em; font-size: 34px; line-height: 1.05; margin: 6px 0 6px; outline: none; color: var(--navy); }
.card .intro { color: var(--muted); margin: 0 0 18px; }

.progress { background: var(--blue-soft); border-radius: 12px; padding: 12px 14px 14px; margin: 0 0 26px; }
.progress .row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: var(--navy); margin: 0 0 8px; }
.progress .bar { height: 8px; border-radius: 99px; background: #CFE0F7; overflow: hidden; }
.progress .fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--yellow)); transition: width .35s ease; }

.section { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
.section .num { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--navy); color: var(--yellow); font-family: var(--display); font-weight: 800; font-size: 20px; display: grid; place-items: center; }
.section h3 { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 23px; margin: 0; color: var(--navy); white-space: nowrap; }
.section::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.field { margin: 0 0 22px; }
.field .lbl { display: block; font-weight: 700; font-size: 16px; margin: 0 0 5px; color: var(--navy); }
.req { color: var(--err); margin-left: 3px; }
.hint { color: var(--muted); font-size: 15px; margin: 0 0 9px; }
input[type="text"], input[type="email"], input[type="tel"], textarea { width: 100%; padding: 14px 15px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--field); color: var(--ink); font: inherit; font-size: 17px; transition: border-color .2s, box-shadow .2s, background .2s; }
input:hover, textarea:hover { border-color: #93A8C6; }
input:focus, textarea:focus { outline: none; background: #fff; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(22,118,224,.22); }
textarea { min-height: 112px; resize: vertical; }
.field.invalid input, .field.invalid textarea { border-color: var(--err); background: #FFF6F5; }
.err { color: var(--err); font-size: 15px; font-weight: 600; margin: 6px 0 0; }
.divider { border: 0; height: 1px; background: var(--line); margin: 10px 0 26px; }

.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; }
.btn { font: inherit; font-weight: 700; font-size: 18px; letter-spacing: .01em; padding: 15px 28px; border-radius: 14px; border: 0; background: linear-gradient(180deg, #FFEB3B, var(--yellow)); color: var(--navy); cursor: pointer; min-height: 56px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 8px 20px -6px rgba(255,224,0,.7), 0 0 0 1.5px var(--navy); transition: transform .15s, box-shadow .2s, filter .2s; }
.btn:hover { transform: translateY(-2px); filter: brightness(1.04); box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 14px 26px -8px rgba(255,224,0,.8), 0 0 0 1.5px var(--navy); }
.btn:active { transform: translateY(0); }
.btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.btn svg { width: 20px; height: 20px; transition: transform .2s; }
.btn:hover svg { transform: translateX(3px); }
.btn.ghost { background: transparent; box-shadow: 0 0 0 1.5px var(--line); }
.btn.ghost:hover { background: var(--blue-soft); box-shadow: 0 0 0 1.5px var(--blue); filter: none; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .6; cursor: default; transform: none; }
.status { margin: 14px 0 0; font-size: 14.5px; color: var(--muted); text-align: center; }
.status.bad { color: var(--err); font-weight: 600; }
.copybox { width: 100%; min-height: 260px; font-size: 15px; }
.check { width: 72px; height: 72px; border-radius: 50%; background: var(--yellow); display: grid; place-items: center; margin: 4px 0 16px; box-shadow: 0 0 0 8px rgba(255,224,0,.28); }
.check svg { width: 36px; height: 36px; stroke: var(--navy); }

.foot { text-align: center; color: var(--muted); font-size: 14px; padding: 0 16px 36px; }
.foot b { color: var(--navy); }

@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.hero-in > * { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
.hero-in > :nth-child(2) { animation-delay: .08s; } .hero-in > :nth-child(3) { animation-delay: .16s; } .hero-in > :nth-child(4) { animation-delay: .24s; }
.wrap { animation: rise .8s .3s cubic-bezier(.2,.7,.2,1) both; }
@media (max-width: 520px) { .card { padding: 26px 16px 22px; } .card::before { left: 16px; right: 16px; } .btn { width: 100%; } .nav { flex-direction: column; } .hero { padding-top: 32px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <span class="eyebrow">Partnership kickoff</span>
    <img src="logo.png" alt="Taurus Farm Pickleball Court logo" width="168" height="159">
    <h1>Kickoff <em>form</em></h1>
    <p class="lead">Tell us about Taurus Farm so we can set up your social pages and booking system. It takes about 5 minutes, and your draft is saved on this device.</p>
  </div>
</header>
<div class="wrap"><main id="app"></main></div>
<p class="foot">Prepared by <b>Katha Digital</b> for Taurus Farm Pickleball Court</p>

<script>
(function () {
  "use strict";

  /* Paste your Google Apps Script Web app URL (ends in /exec) here. See README. */
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbw9r-OcKXoN-0wmfW9pkLHHUvdQk8BfuKxXZMUD3COoi8jxA41NTXfMggPhmS-T08T8/exec";

  var BUSINESS_NAME = "Taurus Farm Pickleball Court";
  var DRAFT_KEY ="taurus-kickoff-draft-v2";

  var TITLE = "About Taurus Farm";
  var INTRO = "Fields marked * are required. Answer the rest as best you can. You can edit and send again later.";

  var FIELDS = [
    { id: "address", label: "Business Address", hint: "Street, barangay, city, and a nearby landmark.", type: "textarea", rows: 3, required: true },
    { id: "phone", label: "Business Contact Number", type: "tel", required: true },
    { id: "email", label: "Email Address", type: "email", required: true },
    { id: "offers", label: "Business Offers", hint: "List what you offer and the price of each, such as court rental, Open Play, coaching, memberships and promos.", type: "textarea", rows: 6 },
    { id: "projects", label: "Business Future Projects", hint: "Anything you plan to build or start, such as new courts or new services. Add roughly when.", type: "textarea", rows: 5 },
    { id: "events", label: "Business Future Events", hint: "Tournaments, Open Play nights, launches or promos coming up, with dates if you have them.", type: "textarea", rows: 5 }
  ];

  var app = document.getElementById("app");
  var state = { answers: {}, done: false, mode: "sent", busy: false, message: "" };
  

  /* ---------- helpers ---------- */
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === false || v === null || v === undefined) return;
        if (k === "class") n.className = v;
        else if (k === "text") n.textContent = v;
        else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v);
      });
    }
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }

  function getVal(id) {
    var v = state.answers[id];
    return v === undefined ? "" : String(v);
  }

  function saveDraft() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ answers: state.answers })); } catch (e) { /* storage may be unavailable */ }
  }

  function loadDraft() {
    try {
      var raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && d.answers && typeof d.answers === "object") state.answers = d.answers;
    } catch (e) { /* ignore a broken draft */ }
  }

  function toText() {
    var lines = ["Taurus Farm kickoff form", "Submitted: " + new Date().toISOString().slice(0, 10), "Business Name: " + BUSINESS_NAME, ""];
    FIELDS.forEach(function (f) {
      var v = getVal(f.id).trim();
      if (!v) { lines.push(f.label + ": Not answered"); return; }
      lines.push(v.indexOf("\n") > -1 ? f.label + ":\n" + v : f.label + ": " + v);
    });
    return lines.join("\n");
  }

  /* ---------- validation ---------- */
  function validate() {
    var errs = [];
    FIELDS.forEach(function (f) {
      var v = getVal(f.id).trim();
      if (f.required && !v) errs.push({ id: f.id, msg: "This answer is needed." });
      else if (f.type === "email" && v && !/^\S+@\S+\.\S+$/.test(v)) errs.push({ id: f.id, msg: "Check the email address. It should look like name@example.com." });
    });
    return errs;
  }

  function showErrors(errs) {
    var first = null;
    errs.forEach(function (e) {
      var wrap = app.querySelector('[data-id="' + e.id + '"]');
      if (!wrap) return;
      wrap.classList.add("invalid");
      var p = wrap.querySelector(".err");
      if (p) { p.textContent = e.msg; p.hidden = false; }
      if (!first) first = wrap;
    });
    if (first) {
      var c = first.querySelector("input, textarea");
      if (c) c.focus();
    }
  }

  /* ---------- rendering ---------- */
  function renderField(f) {
    var id = "f-" + f.id;
    var wrap = el("div", { class: "field", "data-id": f.id });
    var lab = el("label", { class: "lbl", for: id, text: f.label });
    if (f.required) lab.appendChild(el("span", { class: "req", "aria-hidden": "true", text: "*" }));
    wrap.appendChild(lab);
    if (f.hint) wrap.appendChild(el("p", { class: "hint", id: id + "-hint", text: f.hint }));
    var control = f.type === "textarea"
      ? el("textarea", { id: id, rows: String(f.rows || 3) })
      : el("input", { type: f.type, id: id, autocomplete: f.type === "email" ? "email" : (f.type === "tel" ? "tel" : "off") });
    if (f.hint) control.setAttribute("aria-describedby", id + "-hint");
    if (f.required) control.setAttribute("aria-required", "true");
    control.value = getVal(f.id);
    control.addEventListener("input", function () {
      state.answers[f.id] = control.value;
      updateProgress();
      wrap.classList.remove("invalid");
      var p = wrap.querySelector(".err");
      if (p) p.hidden = true;
      saveDraft();
    });
    wrap.appendChild(control);
    wrap.appendChild(el("p", { class: "err", role: "alert", hidden: "hidden" }));
    return wrap;
  }

  function sendBtn() {
    var b = el("button", { type: "button", class: "btn wide", disabled: state.busy ? "disabled" : false, onclick: submit });
    b.appendChild(document.createTextNode(state.busy ? "Sending..." : (backendReady() ? "Send to katha" : "Get my answers to send")));
    var i = document.createElement("span");
    i.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    b.appendChild(i.firstChild);
    return b;
  }
  function backendReady() { return !!ENDPOINT; }

  function renderForm() {
    var card = el("section", { class: "card" });
    card.appendChild(el("h2", { id: "title", tabindex: "-1", text: TITLE }));
    card.appendChild(el("p", { class: "intro", text: INTRO }));
    card.appendChild(el("div", { class: "progress", id: "prog" }, [
      el("div", { class: "row" }, [el("span", { text: "Required details" }), el("span", { id: "prog-n", text: "0 of 3" })]),
      el("div", { class: "bar", role: "presentation" }, [el("div", { class: "fill", id: "prog-f" })])
    ]));
    FIELDS.forEach(function (f, i) {
      if (i === 0) card.appendChild(el("div", { class: "section" }, [el("span", { class: "num", "aria-hidden": "true", text: "1" }), el("h3", { text: "Business information" })]));
      if (i === 3) {
        card.appendChild(el("hr", { class: "divider" }));
        card.appendChild(el("div", { class: "section" }, [el("span", { class: "num", "aria-hidden": "true", text: "2" }), el("h3", { text: "Offers and plans" })]));
      }
      card.appendChild(renderField(f));
    });
    var canSend = !!ENDPOINT;
    card.appendChild(el("div", { class: "nav" }, [
      sendBtn()
    ]));
    if (!canSend) card.appendChild(el("p", { class: "status", text: "Sending from this page is not available in this view. You will get your answers as text to copy and send to us." }));
    card.appendChild(el("p", { class: "status", text: "Please do not type bank or GCash account numbers here." }));
    if (state.message) card.appendChild(el("p", { class: "status bad", role: "alert", text: state.message }));
    return card;
  }

  function copyAnswers(ta, status) {
    var ok = false;
    try {
      ta.focus();
      ta.select();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(
          function () { status.textContent = "Copied."; },
          function () { status.textContent = "Select the text above and copy it."; }
        );
        ok = true;
      }
    } catch (e) { ok = false; }
    if (!ok) status.textContent = "Select the text above and copy it.";
  }

  function renderDone() {
    var card = el("section", { class: "card" });
    if (state.mode === "sent") {
      var chk = el("div", { class: "check", "aria-hidden": "true" });
      chk.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
      card.appendChild(chk);
      card.appendChild(el("h2", { id: "title", tabindex: "-1", text: "Thank you" }));
      card.appendChild(el("p", { class: "intro", text: "Your answers were sent to katha. If something changes, edit your answers and send them again." }));
    } else {
      card.appendChild(el("h2", { id: "title", tabindex: "-1", text: "Your answers" }));
      card.appendChild(el("p", { class: "intro", text: "Copy this text and send it to katha. We will add it to your kickoff document." }));
      var ta = el("textarea", { class: "copybox", readonly: "readonly", "aria-label": "Your answers as text" });
      ta.value = toText();
      var status = el("p", { class: "status", role: "status" });
      card.appendChild(ta);
      card.appendChild(el("div", { class: "nav" }, [
        el("button", { type: "button", class: "btn", text: "Copy answers", onclick: function () { copyAnswers(ta, status); } }),
        el("span")
      ]));
      card.appendChild(status);
    }
    card.appendChild(el("div", { class: "nav" }, [
      el("button", { type: "button", class: "btn ghost", text: "Edit my answers", onclick: function () { state.done = false; render(); } }),
      el("button", { type: "button", class: "btn", text: "Back to home", onclick: function () {
        state.answers = {}; state.message = ""; state.done = false;
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
        render(); window.scrollTo(0, 0);
      } })
    ]));
    return card;
  }

  function updateProgress() {
    var n = document.getElementById("prog-n"), f = document.getElementById("prog-f");
    if (!n || !f) return;
    var req = FIELDS.filter(function (x) { return x.required; });
    var done = req.filter(function (x) { return getVal(x.id).trim(); }).length;
    n.textContent = done + " of " + req.length;
    f.style.width = (done / req.length * 100) + "%";
  }

  function render(errs) {
    app.textContent = "";
    app.appendChild(state.done ? renderDone() : renderForm());
    var t = document.getElementById("title");
    if (t && !errs) t.focus({ preventScroll: true });
    if (errs) showErrors(errs);
    updateProgress();
  }

  /* ---------- submit ---------- */
  function submit() {
    var errs = validate();
    if (errs.length) { state.message = ""; render(errs); return; }
    if (!ENDPOINT) {
      state.mode = "copy";
      state.done = true;
      render();
      window.scrollTo(0, 0);
      return;
    }
    state.busy = true;
    state.message = "";
    render();
    var payload = {
      submittedAt: new Date().toISOString(),
      website: "",
      answers: Object.assign({}, JSON.parse(JSON.stringify(state.answers)), { business: BUSINESS_NAME })
    };
    fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
      .then(function () {
        state.busy = false;
        state.mode = "sent";
        state.done = true;
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
        render();
        window.scrollTo(0, 0);
      })
      .catch(function () {
        state.busy = false;
        state.message = "We could not send your answers. Check your connection and try again, or copy them as text.";
        render();
      });
  }

  /* ---------- start ---------- */
  loadDraft();
  render();

})();
</script>
</body>
</html>
